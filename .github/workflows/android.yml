name: Build Android (arm64) APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Unity Android Build
    runs-on: ubuntu-latest
    # GameCI requires a Unity license. Set these secrets in repo Settings > Secrets:
    #   UNITY_LICENSE          full license content (unity-editor.license file contents)
    #   UNITY_EMAIL            your Unity account email
    #   UNITY_PASSWORD         your Unity account password
    # License: free Personal account. Unity killed manual (.alf) activation for
    # Personal licenses (Aug 2023) — get the .ulf via Unity Hub instead:
    #   Hub > Preferences > Licenses > Add > Get a free personal license
    #   then copy the contents of Unity_lic.ulf into the UNITY_LICENSE secret.
    # GameCI v4 REQUIRES UNITY_LICENSE (or UNITY_SERIAL for Pro/Plus);
    # UNITY_EMAIL + UNITY_PASSWORD alone is not enough.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk cache (unity image is ~15GB inflated)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup
          docker system prune -af --volumes
          df -h / | tail -1

      - name: Unity Build (Android, IL2CPP, arm64)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          unityVersion: 2021.3.45f1
          buildMethod: BuildScript.BuildPlayer
          androidExportType: androidPackage
          buildsPath: build
          skipActivation: false

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: juggernaut-arm64-apk
          path: build/*.apk
