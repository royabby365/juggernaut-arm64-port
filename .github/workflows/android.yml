name: Build Android (arm64) APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Unity Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk cache (unity image is ~15GB inflated)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache /opt/ghc /usr/local/.ghcup
          docker system prune -af --volumes
          df -h / | tail -1

      - name: Extract serial from .ulf for Personal license
        id: extract-serial
        run: |
          python3 .github/scripts/extract_serial.py >> $GITHUB_OUTPUT
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

      - name: Build Android APK using Docker (replicates local_build.sh)
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ steps.extract-serial.outputs.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          REPO="${{ github.workspace }}"
          IMAGE="unityci/editor:ubuntu-2021.3.45f1-android-3"
          mkdir -p "$REPO/build"
          echo "[build] activating license + building (this takes 5-10 min, IL2CPP)..."
          docker run --rm \
            -v "$REPO":/github/workspace \
            -w /github/workspace \
            --env UNITY_EMAIL="$UNITY_EMAIL" \
            --env UNITY_PASSWORD="$UNITY_PASSWORD" \
            --env UNITY_SERIAL="$UNITY_SERIAL" \
            --env UNITY_LICENSE="$UNITY_LICENSE" \
            --cpus="$(nproc)" \
            --memory="$(free -b | awk '/Mem:/{print $7}' | xargs -I{} echo "{} / 1024 / 1024" | bc)m" \
            "$IMAGE" \
            bash -c '
              set -uo pipefail
              # Personal license (F*) needs machine-id randomization for activation
              if [[ "$UNITY_SERIAL" = F* ]]; then
                echo "[container] Randomizing machine ID for personal license activation"
                mkdir -p /var/lib/dbus/ && ln -sf /etc/machine-id /var/lib/dbus/machine-id
              fi
              # Pre-create editor license cache dir (Unity licensing client needs this)
              mkdir -p /root/.cache/unity3d
              # Create BlankProject for activation (must exist at /BlankProject)
              mkdir -p /BlankProject/Assets
              echo "[container] === activation ==="
              unity-editor -logFile /dev/stdout -quit -serial "$UNITY_SERIAL" \
                -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" \
                -projectPath /BlankProject
              ACTIVATION_RC=$?
              echo "[container] activation exit=$ACTIVATION_RC"
              if [ $ACTIVATION_RC -ne 0 ]; then
                echo "[container] activation failed, but continuing to build..."
              fi
              echo "[container] === build ==="
              # Run build with minimal args - let BuildScript handle everything
              unity-editor -batchmode -nographics -logFile /dev/stdout -quit \
                -projectPath /github/workspace \
                -executeMethod BuildScript.BuildPlayer
              BUILD_RC=$?
              echo "[container] build exit=$BUILD_RC"
              exit $BUILD_RC
            '; echo "[container] done"
          RC=$?
          echo "[build] container exit=$RC"
          ls -la "$REPO/build/Android/" 2>/dev/null | grep -E "apk|aab" && echo "[build] APK produced" || echo "[build] no APK yet"
          exit $RC

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: juggernaut-arm64-apk
          path: build/**/*.apk