name: Activate Unity License

on:
  workflow_dispatch:

jobs:
  activation:
    name: Request Unity License File
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        uses: game-ci/request-activation-file@v2
        with:
          unityVersion: 2021.3.45f1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Open PR with license file
        uses: game-ci/unity-activate@v2
        # This opens a PR containing Unity.lic — download it, then add it as the
        # UNITY_LICENSE secret in repo Settings > Secrets, then run the build.
